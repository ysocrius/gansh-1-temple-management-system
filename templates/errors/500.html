{% extends "user/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-page">
                <h1 class="display-1 text-danger">500</h1>
                <h2 class="mb-4">Internal Server Error</h2>
                <p class="lead mb-4">We're experiencing some technical difficulties. Our team has been notified and is working to fix the issue.</p>
                <div class="error-actions">
                    <a href="{{ url_for('general.home') }}" class="btn btn-primary btn-lg">
                        <i class="fas fa-home me-2"></i>Go to Homepage
                    </a>
                    <button onclick="window.location.reload()" class="btn btn-outline-primary btn-lg ms-3">
                        <i class="fas fa-sync-alt me-2"></i>Try Again
                    </button>
                </div>
                <div class="mt-4">
                    <small class="text-muted">If the problem persists, please contact our support team.</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
